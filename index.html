<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ぼくらのダンジョン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Mochiy+Pop+One&display=swap" rel="stylesheet">
<style>
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none}
*{-webkit-tap-highlight-color:transparent}
button,.rcrow,.rpmh,.tpg,.tier,img,svg{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{-webkit-user-select:none;user-select:none}
input,textarea,select{-webkit-user-select:text;user-select:text;font-size:16px}

/* VOICE: 懐かしいコマンドRPGの手触り。短い文、はっきりした反応
   IDEA: 白枠の黒いウィンドウが重なる、レトロRPGの画面そのもの
   PICTURE: 戦闘は夜明けの草原と魔物、スキルツリーは星座のように広がる網
   COLOUR and TYPE: 深い藍、白枠ウィンドウ、金の選択色 / DotGothic16
   LAYOUT: 縦1カラム最大480px。ツリーだけは横スクロールの大きな盤 */
:root{color-scheme:light dark;--bg:light-dark(#1b2350,#0a0e22);--win:#0d1230;--ink:#fff;--acc:#ffd54a;--hp:#5ee08a;--mp:#5ab8ff;--bad:#ff6b6b;--uq:#ff9be0}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "DotGothic16",system-ui,sans-serif;overflow-x:clip;min-height:100vh}
#app{max-width:480px;margin:0 auto;padding:12px 12px 28px;display:flex;flex-direction:column;gap:10px}
#app.wide{max-width:900px}
.win{background:var(--win);border:3px solid #fff;border-radius:10px;padding:12px 14px;box-shadow:0 0 0 3px var(--win)}
h1{font-size:32px;line-height:1.05;margin:6px 0 2px;text-wrap:balance;font-weight:400}
h2{font-size:20px;margin:0 0 6px;font-weight:400}
.sub{opacity:.75;font-size:14px;margin:0}
button{font:inherit;color:var(--ink);background:transparent;border:0;min-height:44px;padding:8px 10px;text-align:left;cursor:pointer;border-radius:6px;width:100%}
button:hover,button:focus-visible{outline:2px solid var(--acc);color:var(--acc)}
button:hover::before,button:focus-visible::before{content:"▶ "}
button:disabled{opacity:.35;cursor:default;outline:0;color:var(--ink)}
button:disabled::before,.pm::before,.pm:hover::before{content:none!important}
.job{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;border:2px solid #ffffff33;margin-bottom:8px;padding:10px}
.job svg{width:64px;height:64px}
.job b{font-weight:400;font-size:20px;display:block}
.job small,.menu small,.cmd small,.uq small{display:block;font-size:13px;opacity:.75}
.row{display:grid;grid-template-columns:1fr auto auto auto;gap:6px;align-items:center;padding:4px 0;border-bottom:1px dashed #ffffff22}
.row .n{font-size:22px;text-align:right;min-width:2.6em}
.row .n i{font-style:normal;font-size:13px;color:var(--hp)}
.row small{font-size:13px;opacity:.7}
.pm{width:44px;min-height:44px;text-align:center;border:2px solid #ffffff55;padding:0;font-size:20px}
.pts{font-size:22px;color:var(--acc)}
.cta{border:2px solid var(--acc);color:var(--acc);text-align:center;margin-top:10px;font-size:18px}
.field{position:relative;height:min(40vh,290px);border-radius:10px;overflow:hidden;border:3px solid #fff;
 background:linear-gradient(#24306e 0,#4a3f8c 45%,#e98a6b 62%,#3f7a4a 62.5%,#2c5c37 100%)}
.field .sun{position:absolute;left:12%;top:44%;width:70px;height:70px;border-radius:50%;background:#ffd98a;opacity:.85}
.field .hill{position:absolute;bottom:30%;width:60%;height:22%;background:#35664a;border-radius:50% 50% 0 0}
.foe{position:absolute;left:50%;bottom:12%;width:150px;height:150px;transform:translateX(-50%)}
.foe svg{width:100%;height:100%;filter:drop-shadow(0 8px 0 #0004)}
.foe.hit{animation:hit .35s}
.foe.ice svg{filter:drop-shadow(0 8px 0 #0004) hue-rotate(160deg) brightness(1.3)}
.foe.dead{transition:opacity .6s,transform .6s;opacity:0;transform:translateX(-50%) scale(.6)}
@keyframes hit{0%,100%{transform:translateX(-50%)}25%{transform:translateX(-46%)}75%{transform:translateX(-54%)}}
.shake{animation:shk .3s}
@keyframes shk{0%,100%{transform:none}30%{transform:translate(4px,2px)}60%{transform:translate(-4px,-1px)}}
.tag{position:absolute;top:8px;left:8px;right:8px;background:#0008;border-radius:6px;padding:4px 10px;font-size:14px}
.bar{height:8px;background:#ffffff22;border-radius:4px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;transition:width .4s}
.st{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-size:15px}
.st .lv{grid-column:1/-1;display:flex;justify-content:space-between;flex-wrap:wrap}
.msg{min-height:96px}
.msg p{margin:0}
.cmd{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
.cmd.list{grid-template-columns:1fr 1fr}
.uqt{color:var(--uq)}
.habit{font-size:13px;opacity:.75;margin:0}
.dmg{color:var(--bad)}.heal{color:var(--hp)}.mpc{color:var(--mp)}
.menu{display:grid;gap:6px}
.menu button{border:2px solid #ffffff33}
.items{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;opacity:.85}
/* スキルツリー */
.treebar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.treebar button{width:auto;border:2px solid #ffffff44;font-size:14px}
.board{overflow:auto;border:3px solid #fff;border-radius:10px;background:radial-gradient(circle at 10% 50%,#2a2350,#0a0d20 70%);-webkit-overflow-scrolling:touch}
.board svg{display:block}
.board [data-id]{cursor:pointer}
.board [data-id]:focus{outline:none}
.board [data-id]:focus circle.base{stroke:var(--acc);stroke-width:4}
.detail{min-height:150px}
.detail b{font-weight:400;font-size:18px}
.detail .cost{color:var(--acc)}
.lvopt b{font-weight:400;font-size:18px;color:var(--acc)}
.uq{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border-bottom:1px dashed #ffffff22;padding:8px 0}
.uq b{font-weight:400}
.uq .eq{width:auto;border:2px solid #ffffff44;font-size:14px}
.uq .eq.on{border-color:var(--uq);color:var(--uq)}
.hint{font-size:14px;padding:4px 0}
.hint .barw{height:6px;background:#ffffff22;border-radius:3px;margin-top:3px;overflow:hidden}
.hint .barw i{display:block;height:100%;background:var(--uq)}
.gold{color:var(--acc)}
.doors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.door{display:flex;flex-direction:column;align-items:center;text-align:center;border:2px solid #ffffff44;padding:10px 6px;gap:2px;background:linear-gradient(#1a2048,#0d1230)}
.door:hover::before,.door:focus-visible::before{content:none}
.door .arch{width:44px;height:56px;border-radius:22px 22px 4px 4px;background:linear-gradient(#5d4037,#3e2723);border:3px solid #a1887f;box-shadow:inset 0 0 0 4px #00000040;margin-bottom:4px}
.door b{font-weight:400;font-size:15px}
.door small{font-size:12px;opacity:.75;display:block}
.door.bossd{grid-column:1/-1}
.door.bossd .arch{width:70px;height:80px;border-color:var(--bad);background:linear-gradient(#7b1f1f,#2a0a0a)}
.field.cave{background:radial-gradient(ellipse at 50% 100%,#4a3a5e 0,#1c1430 55%,#0b0814 100%)}
.field.cave .sun{left:46%;top:8%;width:18px;height:18px;opacity:.5;box-shadow:120px 30px 0 -4px #ffd98a,-130px 50px 0 -5px #ffd98a}
.field.cave .hill{background:#2a2040}
.field.boss{background:radial-gradient(ellipse at 50% 100%,#7b2b2b 0,#2a1020 55%,#0b0814 100%)}
.foe.big{width:190px;height:190px;bottom:8%}
.depth h1{letter-spacing:.04em}
.hdr{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px;padding:2px 4px}
.gem{color:#7fe3ff}
.note{margin:0;font-size:15px}
#app.tabbed{padding-bottom:96px}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--win);border-top:3px solid #fff;padding:4px max(4px,env(safe-area-inset-left)) calc(4px + env(safe-area-inset-bottom))}
#tabs[hidden]{display:none}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;padding:6px 0;min-height:56px;text-align:center}
#tabs button::before{content:none!important}
#tabs button.on{color:var(--acc);background:#ffffff10}
.ti{width:22px;height:22px;display:block;border:2px solid currentColor}
.ti.d{border-radius:11px 11px 2px 2px}
.ti.p{border-radius:50%;box-shadow:8px 4px 0 -4px currentColor}
.ti.g{border-radius:50%;background:radial-gradient(circle at 35% 35%,currentColor 0 3px,transparent 4px)}
.ti.s{border-radius:2px 2px 6px 6px;border-top-width:5px}
.ti.f{border-radius:50%;width:16px;height:16px;box-shadow:9px 6px 0 0 var(--win),9px 6px 0 2px currentColor}
.party{display:grid;gap:6px;padding:10px 12px}
.prow{display:grid;grid-template-columns:5.5em 1fr 1fr;gap:8px;align-items:center;font-size:14px;border-radius:6px;padding:2px 4px}
.prow .pn small{display:block;font-size:12px;opacity:.7}
.prow.cur{outline:2px solid var(--acc)}
.prow.down{opacity:.45}
.who{margin:0 0 6px;color:var(--acc)}
.who:empty{display:none}
.mlist{display:grid;gap:6px}
.mcard{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center;border:2px solid #ffffff33}
.mcard.inp{border-color:#ffd54a88}
.mcard svg{width:48px;height:48px}
.mcard b{font-weight:400}
.mcard::before,.mcard:hover::before,.mcard:focus-visible::before{content:none!important}
.mhead{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center}
.mhead svg{width:72px;height:72px}
.star{color:var(--acc);font-size:14px}
.gst{color:#7fe3ff}.sigt{color:#ffb347;font-weight:bold}.tpages{display:flex;gap:4px;overflow-x:auto;margin:0 0 6px;padding:0 2px}.tpg{flex:none;width:auto!important;min-width:0;margin:0!important;display:inline-block;padding:6px 10px;border-radius:8px;background:#3e2723;color:#fff;border:1px solid #c8a96a66;font-size:13px}.tpg.on{background:#ffd54a;color:#3e2723;font-weight:bold}.tpg.lock{opacity:.6}.rcrow[data-ri]{cursor:pointer}.rpmh{display:flex;align-items:center;gap:8px;cursor:pointer}.rpav{width:52px;height:52px;flex:none}.rpav svg{width:52px;height:52px}.rpic{width:140px;height:140px;margin:0 auto}.rpic svg{width:100%;height:100%}.rpmd h3{margin:10px 0 4px;font-size:14px;color:#ffd54a}.rchips{display:flex;flex-wrap:wrap;gap:4px}.rchip{display:flex;flex-direction:column;background:#ffffff14;border:1px solid #ffffff22;border-radius:8px;padding:4px 7px;max-width:100%}.rchip b{font-size:12px}.rchip small{font-size:10px;opacity:.75}.rchip.gs b{color:#7fe3ff}.rchip.uq b{color:#ffd54a}.ovl{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:50}.ovl .tbox{background:var(--win);border:3px solid #c8a96a;border-radius:14px;padding:16px;width:min(340px,90vw)}.ovl input{width:100%;font-size:18px;padding:8px;border-radius:8px}.mirror svg{filter:drop-shadow(0 0 8px #7c4dff) brightness(.72) saturate(.6) hue-rotate(200deg)}.tpg.fz{background:#ad1457}.tpg.fz.on{background:#ff80ab;color:#3e2723}.fzpic{width:160px;height:160px;margin:0 auto}.fzpic svg{width:100%;height:100%}.fzj.on{outline:3px solid #fff}.tpg small{display:block;font-size:9px}.godsh{margin:14px 4px 4px;color:#ffd54a;text-shadow:0 2px 0 #000}.tiers{display:flex;flex-wrap:wrap;gap:4px;margin:0 4px 8px}.tier{flex:1 0 18%;text-align:center;padding:6px 0;font-size:12px;border-radius:8px;background:#3e2723;color:#fff;border:1px solid #c8a96a66}.tier.on{background:#ffd54a;color:#3e2723;font-weight:bold}details.rates summary{cursor:pointer;margin-top:6px}.rtab{width:100%;border-collapse:collapse;margin:6px 0;font-size:14px}.rtab th,.rtab td{padding:4px 8px;border-bottom:1px solid #ffffff22;text-align:left}.rtab td:last-child,.rtab th:last-child{text-align:right}.rtab small{opacity:.7;font-size:11px;margin-left:4px}.rtab tr.r5 td:first-child{color:#ffd54a}.rtab tr.r6 td:first-child{color:#ff80ab}.rtab tr.r7 td:first-child{color:#b388ff}.rbtns{display:flex;gap:6px;align-items:stretch}#recb{font-size:12px;line-height:1.2;padding:4px 8px}.rcrow{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid #ffffff22}.rcrow.me{background:#ffd54a22;border-radius:8px}.rk{width:26px;text-align:center;font-weight:bold;font-size:16px}.rk.top0{color:#ffd54a}.rk.top1{color:#cfd8dc}.rk.top2{color:#d7a26b}.rav{width:44px;height:44px;flex:none;overflow:hidden}.rav svg{width:44px;height:44px}.rinfo{flex:1;min-width:0;display:flex;flex-direction:column}.rinfo b em{font-style:normal;font-size:10px;margin-left:6px;background:#ffd54a;color:#3e2723;border-radius:6px;padding:1px 5px}.rinfo small,.rlay small{opacity:.75;font-size:11px}.rlay{text-align:right;display:flex;flex-direction:column}.rinfo b em.gst2{background:#4dd0e1}.rcnew{display:flex;align-items:center;justify-content:space-between;gap:8px}.jtt{color:#ffd98a}.sigb{border:1px solid #ffb34766;border-radius:8px;padding:6px 8px;margin-top:6px;background:#ffb34712}
button small{display:block;font-size:13px;opacity:.75}
.eqb,.gsb{border:2px solid #ffffff22;margin-top:6px}
.fld{display:flex;gap:10px;align-items:center;margin-top:10px}
input{font:inherit;font-size:16px;color:var(--ink);background:#ffffff12;border:2px solid #ffffff55;border-radius:6px;padding:8px 10px;min-height:44px;flex:1}
input:focus{outline:2px solid var(--acc)}
.dcard{background:linear-gradient(135deg,var(--d1),var(--d2))}
.dcard.lock{opacity:.55}
.depth{background:linear-gradient(135deg,var(--d1),var(--d2))}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:2px solid #ffffff44;text-align:center}
.seg button.on{border-color:var(--acc);color:var(--acc)}
.gbox.comp{background:linear-gradient(135deg,#3a2a6b,#0d1230)}
.gbox.skill{background:linear-gradient(135deg,#14506b,#0d1230)}
.pulls{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.pull{display:flex;flex-direction:column;align-items:center;text-align:center;border:2px solid #ffffff33;border-radius:8px;padding:6px 4px;font-size:13px;animation:pop .4s backwards}
.pull svg{width:48px;height:48px}
.pull b{font-weight:400;font-size:14px}
.pull small{font-size:11px;opacity:.75}
.pull .orb{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#7fe3ff 40%,#1565c0);margin:4px}
.pull.r3{border-color:#7fe3ff}.pull.r4{border-color:#ce93d8;box-shadow:0 0 12px #ce93d8}.pull.r5{border-color:var(--acc);box-shadow:0 0 16px var(--acc)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.fcode{font-size:30px;letter-spacing:.12em;color:var(--acc);margin:4px 0}
.frow{display:flex;gap:8px}
.frd{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px dashed #ffffff22;padding:6px 0}
.frd small{display:block;font-size:12px;opacity:.6}
.fbtn{display:flex;gap:4px;flex-wrap:wrap}
.fbtn button{width:auto;border:2px solid #ffffff33;font-size:13px}
.field.cave{background:radial-gradient(ellipse at 50% 100%,var(--d1,#4a3a5e) 0,var(--d2,#1c1430) 60%,#07050c 100%)}
@media(prefers-reduced-motion:reduce){.pull{animation:none}}
.seg.two{grid-template-columns:1fr 1fr}
.clr{font-size:12px;color:#10132a;background:var(--acc);border-radius:4px;padding:1px 6px;vertical-align:middle}
.live-b{font-size:12px;color:#fff;background:var(--bad);border-radius:4px;padding:1px 6px;vertical-align:middle;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.4}}
.dcard.sp.live{box-shadow:0 0 0 3px var(--win),0 0 18px #ffd54a}
.raid{display:grid;grid-template-columns:88px 1fr;gap:10px;align-items:center}
.raid svg{width:88px;height:88px}
.raid b{font-weight:400;color:var(--acc)}
.story{color:#ffe9a8}
.rk{font-size:12px;opacity:.75}
.bpair{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:8px 0}
.bslot{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:120px;border:2px dashed #ffffff44;border-radius:8px;padding:6px;text-align:center;font-size:14px}
.bslot svg{width:84px;height:84px}
.bslot b{font-weight:400}
.plus{font-size:28px;color:var(--acc)}
.born{text-align:center}
.bornpic{position:relative;width:180px;height:180px;margin:6px auto}
.bornpic svg{width:100%;height:100%}
.rare::after,.shiny::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;
 background-image:radial-gradient(circle,#fff 0 1.5px,transparent 2.5px),radial-gradient(circle,#fff8c4 0 2px,transparent 3px),radial-gradient(circle,#fff 0 1px,transparent 2px);
 background-size:47px 53px,71px 61px,37px 41px;background-position:0 0,20px 10px,10px 30px;animation:tw 1.4s steps(2) infinite}
.shiny::after{background-image:radial-gradient(circle,#ffd54a 0 2.5px,transparent 3.5px),radial-gradient(circle,#fff 0 2px,transparent 3px),radial-gradient(circle,#fff59d 0 1.5px,transparent 2.5px);background-size:31px 37px,43px 29px,23px 27px}
.shiny svg{filter:drop-shadow(0 0 10px #ffd54a) drop-shadow(0 8px 0 #0004)}
@keyframes tw{50%{opacity:.25;background-position:6px 9px,12px 22px,22px 20px}}
.mcard svg,.bslot svg{overflow:visible}
#fx{position:fixed;inset:0;z-index:50;overflow:hidden;background:radial-gradient(circle at 50% 50%,#1c2350,#000 75%);cursor:pointer}
#fx .rays{position:absolute;inset:-60%;opacity:0;background:repeating-conic-gradient(#ffd54a33 0 8deg,transparent 8deg 18deg);transition:opacity .4s}
#fx.five{background:radial-gradient(circle,#6b4f00,#000 72%)}
#fx.five .rays,#fx.six .rays{opacity:1;animation:spin 7s linear infinite}
#fx.six{background:radial-gradient(circle,#4a0f6b,#000 72%);animation:shk .22s 10}
#fx.six .rays{background:repeating-conic-gradient(hsl(0 90% 60%/.35) 0 8deg,transparent 8deg 16deg,hsl(60 90% 60%/.35) 16deg 24deg,transparent 24deg 32deg,hsl(200 90% 60%/.35) 32deg 40deg,transparent 40deg 48deg)}
@keyframes spin{to{transform:rotate(360deg)}}
#fx .orb{position:absolute;left:50%;top:-170px;width:130px;height:130px;margin-left:-65px;border-radius:50%;
 background:radial-gradient(circle at 35% 30%,#fff 0 8%,var(--oc) 45%,#000 130%);box-shadow:0 0 30px var(--oc);transition:top .9s cubic-bezier(.3,1.35,.6,1),box-shadow .3s}
#fx .orb.fall{top:calc(50% - 65px)}
#fx .orb.shake{animation:osh .18s 4}
#fx .orb.flash{box-shadow:0 0 90px 50px #fff}
#fx .orb.rb{background:conic-gradient(#f44,#fa0,#ff0,#4f4,#0ff,#44f,#f4f,#f44);box-shadow:0 0 60px #fff;animation:spin 1.2s linear infinite}
@keyframes osh{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
#fx .banner{position:absolute;left:0;right:0;top:20%;text-align:center;font-size:clamp(30px,9vw,46px);line-height:1.1;color:var(--acc);text-shadow:0 0 18px #ffb300,0 3px 0 #7a4b00;opacity:0;transform:scale(.4);transition:transform .35s cubic-bezier(.3,1.6,.6,1),opacity .2s;margin:0;padding:0 12px}
#fx .banner.on{opacity:1;transform:scale(1)}
#fx.six .banner{background:linear-gradient(90deg,#ff5252,#ffd740,#69f0ae,#40c4ff,#e040fb);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 10px #fff)}
#fx .conf i{position:absolute;top:-20px;width:8px;height:14px;animation:cf 2.6s linear infinite}
@keyframes cf{to{transform:translateY(115vh) rotate(720deg)}}
#fx .tapskip{position:absolute;bottom:24px;left:0;right:0;text-align:center;font-size:13px;opacity:.6;margin:0}
.orb2{width:40px;height:40px;border-radius:50%;margin:4px;background:radial-gradient(circle at 35% 35%,#fff,#7fe3ff 40%,#1565c0)}
.orb2.r4{background:radial-gradient(circle at 35% 35%,#fff,#ce93d8 40%,#4a148c)}
.orb2.r5{background:radial-gradient(circle at 35% 35%,#fff,#ffd54a 40%,#a86b00)}

/* ===== スキルツリー画面 ===== */
function renderTree(next,msg){
 wide(true);
 const maxP=pagesOpen(P);let pg=window._tpage==='F'&&P.fused?'F':Math.min(+window._tpage||maxP,maxP);
 const GOF=p=>p==='F'?fusionG(P):pageG(P.job,p);let G=GOF(pg),PJ=pg==='F'||pg>1?G.job:P.job;
 const TL=()=>pg==='F'?(P.ftree=P.ftree||[]):P.tree;const X=x=>40+x*62,Y=y=>30+y*54,W=X(TCOLS)+150,H=Y(8)+34;
 let sel=null;
 const own=id=>id===(pg==='F'?'Froot':pageRoot(pg))||TL().includes(id);
 const avail=n=>!own(n.id)&&G.adj[n.id].some(own);
 const laneCol=n=>n.lane==null?P.job.color:PJ.lanes[n.lane].col;
 const R={root:24,small:14,big:20,cap:27};
 const title=n=>n.kind==='root'?(pg==='F'?'合体ツリー':P.job.name+(pg>1?`（${pg}枚目）`:'')):(n.eff.n||descOf(n.eff));
 const drawSvg=()=>{
  const bands=PJ.lanes.map((L,i)=>{const c=[1,4,7][i];return `<rect x="${X(TCOLS-.6)}" y="${Y(c-1.45)}" width="${W-X(TCOLS-.6)}" height="${54*2.9}" rx="10" fill="${L.col}" opacity=".1"/>
   <text x="${X(TCOLS)+34}" y="${Y(c)+6}" fill="${L.col}" font-size="18">${L.name}</text>`;}).join('');
  const lns=G.edges.map(([a,b])=>{const A=G.by[a],Bn=G.by[b],on=own(a)&&own(b),half=own(a)||own(b);
   return `<line x1="${X(A.x)}" y1="${Y(A.y)}" x2="${X(Bn.x)}" y2="${Y(Bn.y)}" stroke="${on?'#ffd54a':half?'#ffd54a88':'#ffffff30'}" stroke-width="${on?3:2}" ${on?'':'stroke-dasharray="4 4"'}/>`;}).join('');
  const nds=G.nodes.map(n=>{const o=own(n.id),av=avail(n),r=R[n.kind],col=laneCol(n);
   const fill=o?col:av?'#1c2246':'#1a1d30',stroke=o?'#fff':av?'#ffd54a':'#555a75',tc=o?'#10132a':av?'#ffd54a':'#6b7090';
   return `<g data-id="${n.id}" tabindex="0" role="button" aria-label="${title(n)}">
    ${sel===n.id?`<circle cx="${X(n.x)}" cy="${Y(n.y)}" r="${r+7}" fill="none" stroke="#fff" stroke-width="2"/>`:''}
    ${n.kind==='cap'?`<circle cx="${X(n.x)}" cy="${Y(n.y)}" r="${r+4}" fill="none" stroke="${col}" stroke-width="2" opacity=".6"/>`:''}
    <circle class="base" cx="${X(n.x)}" cy="${Y(n.y)}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="2.5"/>
    <text x="${X(n.x)}" y="${Y(n.y)+(r>16?7:5)}" text-anchor="middle" fill="${tc}" font-size="${r>16?18:13}">${n.kind==='root'?P.job.name[0]:n.kind==='cap'?'★':glyph(n.eff)}</text></g>`;}).join('');
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${bands}${lns}${nds}</svg>`;
 };
 const draw=()=>{
  const n=sel&&G.by[sel],refund=P.tree.reduce((s,id)=>s+((P.G.by[id]||{}).cost||0),0)+(P.fused?fzTreeEffs(P).reduce((s,x)=>s+(x.cost||0),0):0);
  let det='<p class="sub">ノードをタップすると詳細が見られます。習得済みのノードにつながっているノード（金枠）を覚えられます。道は途中で隣の道ともつながっています。</p>';
  if(n){const o=own(n.id),av=avail(n);
   det=`<b>${n.kind==='cap'?'★ ':''}${title(n)}</b>${n.lane!=null?` <span class="sub">— ${PJ.lanes[n.lane].name}の道</span>`:''}
   <p style="margin:4px 0">${n.kind==='root'?'ここから全ての道が始まります。':n.eff.n?descOf(n.eff):(n.kind==='small'?'ステータス強化ノード':'')}</p>
   ${n.kind!=='root'?`<p class="sub">必要スキルポイント <span class="cost">${n.cost}</span>　${o?'習得済み':av?'習得できます':'まだつながっていません'}</p>
   ${!o?`<button class="cta" id="learn" ${av&&P.sp>=n.cost?'':'disabled'}>${av&&P.sp<n.cost?'スキルポイントが足りません':'習得する'}</button>`:''}`:''}`;}
  $('#app').innerHTML=`<div class="win treebar"><div><h2 style="margin:0">${esc(P.name)}のスキルツリー</h2><p class="sub">${msg||'どの道をどう進むかは自由です'}</p></div>
   <div>スキルポイント <span class="pts">${P.sp}</span></div></div>
  <div class="tpages">${Array.from({length:maxP},(_,i)=>`<button class="tpg ${i+1===pg?'on':''}" data-p="${i+1}">${i+1}枚目</button>`).join('')}<button class="tpg lock" disabled>${maxP+1}枚目 🔒<small>★を取ると解放</small></button>${P.fused?`<button class="tpg fz ${pg==='F'?'on':''}" data-p="F">合体ツリー</button>`:''}</div>
  <div class="board" id="board">${drawSvg()}</div>
  <div class="win detail">${det}</div>
  <div class="win treebar"><button id="reset" ${refund?'':'disabled'}>ツリーをリセット（${refund}pt返却）</button><button class="cta" id="done" style="margin:0;width:auto">${P.sp>0?'とじる（ポイントは貯めておく）':'とじる'}</button></div>`;
  const bd=$('#board');bd.scrollLeft=window._treeScroll||0;bd.onscroll=()=>window._treeScroll=bd.scrollLeft;
  bd.onclick=e=>{const g=e.target.closest('[data-id]');if(g){sel=g.dataset.id;draw();}};
  bd.onkeydown=e=>{if(e.key==='Enter'){const g=e.target.closest('[data-id]');if(g){sel=g.dataset.id;draw();}}};
  document.querySelectorAll('.tpg[data-p]').forEach(b=>b.onclick=()=>{SE('click');pg=b.dataset.p==='F'?'F':+b.dataset.p;window._tpage=pg;G=GOF(pg);PJ=pg==='F'||pg>1?G.job:P.job;sel=null;window._treeScroll=0;draw();});
  const l=$('#learn');if(l)l.onclick=()=>{TL().push(n.id);P.sp-=n.cost;if(n.kind==='cap'&&pg!=='F'){msg=`★ ${pg+1}枚目のスキルツリーが 開いた！`;SE('jackpot');}draw();};
  $('#reset').onclick=()=>{P.sp+=refund;P.tree=[];if(P.fused)P.ftree=[];if(P.trees)P.trees[P.jobKey]=P.tree;sel=null;pg=1;window._tpage=1;G=pageG(P.job,1);PJ=P.job;draw();};
  $('#done').onclick=()=>{window._treeScroll=0;window._tpage=0;next();};
 };
 draw();
}

function renderUniq(back){
 wide(false);
 const draw=()=>{
  const hw=P.hwin||{},hints=Object.keys(CATS).map(c=>{const w=hw[c]||[],t=P.tier[c]||0,N=uqNext(t);if(!N)return {c,done:true,t,h:1,r:2};const ww=w.slice(-N),h=ww.reduce((a,b)=>a+b,0),need=Math.ceil(N*UQ_RATE);return {c,h,n:ww.length,N,need,t,r:h/need};})
   .filter(x=>x.h>0).sort((a,b)=>(b.t-a.t)||(b.r-a.r)).slice(0,8);
  const eq=P.uqEq.length,max=slots();
  $('#app').innerHTML=`<div class="win"><h2>固有スキル</h2><p class="sub">戦い方のクセから生まれる、その人だけの力（技や能力アップ）。目覚めるのは<b>主人公と★7のなかまだけ</b>。<br>直近10戦のうち9割で同じクセが出ると目覚め、その後 直近30戦→50戦→100戦の9割で 同じ力が進化します（最大4段階）。いくつものクセが同時に育ちます。2つのクセが2段階以上になると複合技も生まれ、いっしょに進化します。</p>${canUq(P)?'':'<p class="note">このなかまは 新しい固有スキルには目覚めません（今持っている力は使えます）。</p>'}
   <p style="margin:6px 0 0">装備中 <span class="pts">${eq}/${max}</span><span class="sub">（4レベルごとに枠+1）</span></p></div>
  <div class="win"><h2>目覚めそうな力</h2>${!canUq(P)?'<p class="sub">—</p>':hints.length?hints.map(x=>x.done?`<div class="hint">「${CATS[x.c].label}」 <b class="gold">最大まで進化（段階4）</b></div>`:`<div class="hint">「${CATS[x.c].label}」 ${x.t?`段階${x.t} → ${x.t+1}`:'目覚め'}：直近${x.N}戦中 <b>${x.h}</b>戦（${x.need}戦で${x.t?'進化':'目覚める'}）${x.n<x.N?`<small>　記録 ${x.n}/${x.N}戦</small>`:''}<div class="barw"><i style="width:${Math.min(100,x.r*100)}%"></i></div></div>`).join(''):'<p class="sub">戦えばクセが記録されていきます。</p>'}</div>
  <div class="win">${P.uniq.length?P.uniq.map(u=>{const on=P.uqEq.includes(u.id);return `<div class="uq"><div><b class="uqt">★ ${u.name}</b><small>${u.cat}のクセから　${u.desc}</small></div>
   <button class="eq ${on?'on':''}" data-id="${u.id}" ${!on&&eq>=max?'disabled':''}>${on?'装備中':'装備'}</button></div>`;}).join(''):'<p class="sub">まだ目覚めた力はありません。</p>'}
  <button class="cta" id="bk">もどる</button></div>`;
  document.querySelectorAll('.eq').forEach(b=>b.onclick=()=>{const id=b.dataset.id;P.uqEq=P.uqEq.includes(id)?P.uqEq.filter(x=>x!==id):[...P.uqEq,id];draw();});
  $('#bk').onclick=back;
 };
 draw();
}

 if(await sigAct2(s,me))return false;
 const p=s.p,st=k=>S(k),al=aliveF(),tg=()=>E&&E.hp>0&&!E.gone?E:al[0];
 const dmg1=async(raw,kind)=>{E=tg();if(!E)return 0;await fxPlay(kind||atkFx(me),'foe',{wait:220});return hitFoe(raw-(PIERCE?0:E.def*.6));};
 switch(s.kind){
  case 'berserk':{const miss=1-me.hp/maxHP();await dmg1(st('str')*2*p.k*(1+miss*2)*mult('phys'),'bigslash');break;}
  case 'crowd':{const n=alive().length;await say(`仲間${n}人の力を合わせる！`);for(const e of [...aliveF()]){E=e;await fxPlay('holy','foe',{wait:120});await hitFoe(st(p.stat||'int')*2*p.k*(1+.35*(n-1))*.8-E.def*.5);}break;}
  case 'reviveAll':{const d=party().filter(x=>x.hp<=0);if(!d.length)await say('倒れている仲間は いない。');for(const t of d){as(t,()=>{t.hp=Math.round(maxHP()*p.p);});await say(`${t.name}が 生き返った！`);}break;}
  case 'execute':{E=tg();if(E.hp/E.max<=p.th&&E.kind!=='boss'&&E.kind!=='raid'&&!E.metal&&!E.casino){await fxPlay('crit','foe',{wait:200});E.hp=0;await say(`<span class="uqt">${E.name}を 一撃で しとめた！</span>`);}else await dmg1(st('str')*2*p.k*mult('phys'),'bigslash');break;}
  case 'sacrHeal':{const c=Math.min(me.hp-1,Math.round(maxHP()*p.cost));me.hp-=c;await say(`${me.name}は 身をけずった（${c}）`);for(const t of alive())if(t!==me)await healP(st('int')*p.k+20,t);break;}
  case 'fullHeal':{const t=alive().reduce((a,b)=>ratio(a)<=ratio(b)?a:b);await healP(9999,t);break;}
  case 'regenAll':{B.regen={n:p.n,p:p.p};await fxPlay('heal','party',{wait:200});await say(`${p.n}ターンの間 みんなのHPが回復していく！`);break;}
  case 'buffMeal':{B.pbuff={n:p.n,v:.35};await fxPlay('buff','party',{wait:200});await say('全員の 攻撃力が あがった！');for(const t of alive())as(t,()=>{t.hp=Math.min(maxHP(),t.hp+Math.round(maxHP()*.1));});break;}
  case 'sleep':{const ts=p.all?aliveF():[tg()];for(const e of ts){if(e.kind==='raid'&&Math.random()<.5){await say(`${e.name}には 効かなかった！`);continue;}e.sleep=p.n;await say(`${e.name}は 眠ってしまった！`);}break;}
  case 'random':{const r=Math.random();
   if(r<.25){await say('大ウケ！ 敵全体に大ダメージ！');for(const e of [...aliveF()]){E=e;await fxPlay('explode','foe',{wait:100});await hitFoe((st('str')+st('int'))*3-E.def*.3);}}
   else if(r<.45){await say('みんな元気になった！');for(const t of alive())await healP(9999,t);}
   else if(r<.65){const g=50+me.lv*20;GS.gold+=g;await say(`おひねりが飛んできた！ <span class="gold">${g}G</span>`);}
   else if(r<.85){for(const e of aliveF())e.stunned=true;await say('敵は あっけにとられて 動けない！');}
   else await say('……しーん。すべった。');break;}
  case 'swap':{E=tg();[E.atk,E.def]=[E.def,E.atk];await say(`${E.name}の 攻撃力と守備力が 入れかわった！`);break;}
  case 'lesson':{B.expx=Math.max(B.expx||1,p.x);await say(`この戦闘の経験値が ${p.x}倍になる！`);break;}
  case 'timestop':{for(const e of aliveF()){if((e.kind==='boss'||e.kind==='raid')&&Math.random()<.5){await say(`${e.name}には 効かなかった！`);continue;}e.stunned=true;}await fxPlay('dark','party',{wait:200});await say('敵の時間が とまった！');break;}
  case 'bomb':{B.bombs=B.bombs||[];B.bombs.push({t:p.t,dmg:Math.round((st('int')+st('str'))*p.k)});await say(`${p.t}ターン後に 爆発する装置をしかけた！`);break;}
  case 'arrows':{let one=tg();for(let i=0;i<p.n;i++){const al2=aliveF();if(!al2.length)break;E=p.one&&one&&one.hp>0?one:pick(al2);await fxPlay(p.mag?'star':'slash','foe',{wait:110});await hitFoe((p.mag?st('int'):st('str'))*2*p.k*.6-(E.def*.6));if(E.hp<=0&&await settleDowns())return true;}break;}
  case 'critAll':{B.critAll=p.n;await say(`${p.n}ターンの間 仲間の攻撃が すべて会心になる！`);break;}
  case 'barrier':{for(const t of alive())as(t,()=>{t.bs.barrier=(t.bs.barrier||0)+Math.round((S('def')+me.lv)*p.k*.6+10);});await fxPlay('sanct','party',{wait:200});await say('全員が バリアに つつまれた！');break;}
  case 'harvest':{if(B.harvested){await say('もう 取りつくしてしまった。');break;}B.harvested=1;const g=[['herb',2],['water',1],[pick(['bomb','rev','ball']),1]];g.forEach(([k,c])=>GS.items[k]=(GS.items[k]||0)+c);await say(`${g.map(([k,c])=>ITEMS[k].name+'×'+c).join('、')}を 手に入れた！`);break;}
  case 'charm':{E=tg();if(p.dmg)await dmg1(st('str')*2*p.dmg*mult('phys'));if(E&&E.hp>0){E.charm=(E.charm||0)+p.k;await say(`${E.name}は こちらに 心をひらきはじめた…（スカウト率UP）`);}break;}
  case 'charge':{me.bs.charge=Math.min(4,(me.bs.charge||0)+1);await say(`パワーが たまっている！（${me.bs.charge}/4）`);await dmg1(st('str')*2*p.k*(1+me.bs.charge*.6)*mult('phys'),'smash');break;}
  case 'counter':{B.counter=B.counter||{};B.counter[me.id]={n:p.n,k:p.k};await say(`${me.name}は 反撃の構えを とった！`);break;}
  case 'sumo':{B.taunt={m:me,n:p.n};me.bs.tough=p.n;await say(`${me.name}は どっしりと 構えた！ 攻撃を引きつける！`);break;}
  case 'dodge':{me.bs.dodge=p.n;await say(`${me.name}は 攻撃を かわす構えだ！`);break;}
  case 'goldDmg':{const pay=Math.min(GS.gold,me.lv*p.pay);if(pay<=0){await say('ゴールドが ない…');break;}GS.gold-=pay;await say(`<span class="gold">${pay}G</span> を 支払った！`);await dmg1(pay*2.2+st('int'),'holy');break;}
  case 'weakAll':{for(const e of aliveF()){e.atk0=e.atk0||e.atk;e.def0=e.def0||e.def;e.atk=Math.max(Math.round(e.atk0*.5),Math.round(e.atk*(1-p.v)));e.def=Math.max(Math.round(e.def0*.4),Math.round(e.def*(1-p.v)));}await fxPlay('dark','foe',{wait:200});await say('敵全体の 攻撃力と守備力が さがった！');break;}
  case 'petHeal':{const mons=party().filter(x=>x.mon&&x.hp>0);if(!mons.length){await say('仲間のモンスターが いない…');break;}
   if(p.atk){for(const mo of mons){E=tg();if(!E)break;await say(`${mo.name}の 攻撃！`);await fxPlay(atkFx(mo),'foe',{wait:120});await hitFoe(as(mo,()=>S('str'))*2*p.k*.5-E.def);if(E.hp<=0&&await settleDowns())return true;}}
   else{for(const mo of mons)await healP(st('int')*p.k+20,mo);B.pbuff={n:3,v:.25};await say('モンスターたちが 元気いっぱいだ！');}break;}
  case 'richDmg':{const g=GS.gold;await dmg1(st('str')*2*p.k*(1+Math.log10(1+g)/3)*mult('phys'),'claw');const t=Math.round(10+me.lv*3);GS.gold+=t;await say(`<span class="gold">${t}G</span> を うばった！`);break;}
  case 'dropUp':{B.dropx=true;await say('この戦闘の敵は 必ず道具を落とす！');break;}
  case 'lucky':{const r=Math.random();E=tg();if(r<.45){await say('大当たり！');await dmg1(st('str')*2*p.k*mult('phys'),'crit');}else if(r<.8){await say('まあまあ…');await dmg1(st('str')*2*mult('phys'));}else{const h=Math.round(E.max*.1);E.hp=Math.min(E.max,E.hp+h);await say(`大はずれ！ ${E.name}が ${h} 回復した…`);}break;}
  case 'mpDrain':{const d=await dmg1(st('int')*2*p.k*mult('mag'),'dark');const g=Math.max(1,Math.round(d/6));for(const t of alive())as(t,()=>{t.mp=Math.min(maxMP(),t.mp+g);});await say(`みんなの MPが ${g} 回復した！`);break;}
  case 'selfBomb':{const c=me.hp-1;me.hp=1;await say(`${me.name}は 全てを ぶつけた！`);for(const e of [...aliveF()]){E=e;await fxPlay('explode','foe',{wait:120});await hitFoe((st('str')+st('vit'))*p.k*2+c*.5-E.def*.3);}break;}
  case 'burnAll':{for(const e of aliveF()){e.dot=Math.max(e.dot||0,Math.round(st('int')*p.k+me.lv*2));e.dotT=4;}await fxPlay('gas','foe',{wait:200});await say('敵全体が 毒に おかされた！');break;}
  case 'mpAll':{for(const t of alive())as(t,()=>{t.mp=Math.min(maxMP(),t.mp+p.v);});await say(`みんなの MPが ${p.v} 回復した！`);break;}
  case 'breakDef':{for(const e of aliveF()){e.def0=e.def0||e.def;e.def=0;e.brk=p.n;}await say(`${p.n}ターンの間 敵の守備力が 0になった！`);break;}
  case 'revenge':{const t=me.bs.lastTaken||0;if(!t){await say('やり返す相手が いない…（まだ攻撃を受けていない）');break;}await dmg1(t*p.k+st('str'),'smash');break;}
  case 'allyHit':{B.allies=B.allies||[];B.allies.push({n:p.n,k:p.k,name:p.name,pw:Math.round((st('str')+st('int'))*p.k)});await say(`${p.name}が 仲間に くわわった！（${p.n}ターン）`);break;}
 }
 return false;
}

function mkJT(name,[kind,p,mp]){const s={name,type:'sig',kind,p,mp,jt:true};s.desc=sigDesc(s);return s;}
function plusSig(s){const p={...s.p};
 for(const k of ['k','pay'])if(p[k])p[k]=+(p[k]*1.3).toFixed(2);if(p.n&&s.kind!=='sleep')p.n++;if(p.th)p.th=+(p.th+.05).toFixed(2);if(p.v)p.v=+(p.v*1.25).toFixed(2);if(p.p&&p.p<1)p.p=Math.min(.9,+(p.p*1.25).toFixed(2));
 const k={...s,p,name:s.name+'・改',mp:(s.mp||0)+3};k.desc=sigDesc(k)+'（強化版）';return k;}
for(const [key,d] of Object.entries(JT)){const j=JOBS[key];if(!j)continue;
 j.lanes.forEach((L,li)=>{(L.bigs||[]).forEach(b=>{if(b&&b.skill&&d.t[b.skill.name])b.skill=mkJT(b.skill.name,d.t[b.skill.name]);});
  const ps=(L.bigs||[]).map((b,i)=>[b,i]).filter(([b])=>b&&!b.skill);if(!ps.length||!d.p[li])return;
  const [,i]=ps[li===2&&ps.length>1?1:0];L.bigs[i]={n:d.p[li][0],...d.p[li][1]};});}
function sigBasic(s){const k=s.kind,p=s.p||{},b={name:s.name,mp:s.mp};
 if(['heal1','fullHeal','sacrHeal','petHeal','healAll','regenAll','reviveAll'].includes(k))return {...b,type:'heal',pow:k==='healAll'||k==='regenAll'?3:4};
 if(['barrier','sumo','dodge','guardAll','counter','shield1'].includes(k))return {...b,type:'sanct',turns:2};
 if(['buffMeal','critAll','growth','lesson','dropUp','harvest','mpAll','allyHit'].includes(k))return {...b,type:'buff'};
 if(k==='arrows')return {...b,type:'multi',hits:Math.min(6,p.n||3),pow:+(p.k*.9).toFixed(2)};
 if(p.mag||['crowd','mpDrain','aoe','burnAll','bomb','selfBomb','timestop','sleep','swap','weakAll','breakDef','mark','random'].includes(k))return {...b,type:'mag',pow:+Math.min(3,(p.k||1.5)).toFixed(1)};
 return {...b,type:'phys',pow:+Math.min(3,(p.k||2)).toFixed(1),exec:k==='execute'};}
async function applyX(x,d,me){if(!x||!E)return;
 if(x.drain&&d>0)await healP(d*x.drain,me);
 if(E.hp>0&&x.steal&&Math.random()<x.steal){const k=pick(Object.keys(ITEMS));GS.items[k]=(GS.items[k]||0)+1;await say(`${ITEMS[k].name}を ぬすんだ！`);}
 if(E.hp>0&&x.freeze&&Math.random()<x.freeze){E.frozen=true;await say(`${E.name}は こおりついた！`);}
 await onHitTags({poison:x.poison,stun:x.stun,weaken:x.weaken,armor:x.armor,gold:x.gold?.3:0},d);}
async function sigAct2(s,me){const p=s.p,st=k=>S(k),x=p.x||{};
 switch(s.kind){
  case 'hit':{E=E&&E.hp>0&&!E.gone?E:aliveF()[0];await fxPlay(p.mag?'orb':atkFx(me),'foe',{wait:220});const c=await critRoll(!!x.crit);
   const d=await hitFoe((p.mag?st('int'):st('str'))*2*p.k*c*mult(p.mag?'mag':'phys')*rnd(.9,1.1)-(x.pierce?0:p.mag?E.def*.5:E.def));await applyX(x,d,me);
   if(x.self){const r=Math.min(me.hp-1,Math.round(maxHP()*x.self));me.hp-=r;await say(`反動で <span class="dmg">${r}</span> のダメージ！`);}return true;}
  case 'aoe':{await say('敵 全体を 攻撃！');let first=true;for(const e of [...aliveF()]){E=e;await fxPlay(p.mag?'orb':'bigslash','foe',{wait:first?260:110});first=false;
   const d=await hitFoe((p.mag?st('int'):st('str'))*2*p.k*mult(p.mag?'mag':'phys')*rnd(.9,1.1)-(x.pierce?0:p.mag?E.def*.5:E.def));await applyX({...x,drain:0},d,me);}
   if(x.self){const r=Math.min(me.hp-1,Math.round(maxHP()*x.self));me.hp-=r;await say(`反動で <span class="dmg">${r}</span> のダメージ！`);}return true;}
  case 'heal1':await healP(st('int')*p.k+15);return true;
  case 'healAll':for(const t of alive())await healP(st('int')*p.k+10,t);return true;
  case 'guardAll':B.sanct=Math.max(B.sanct||0,p.n);await fxPlay('sanct','party',{wait:300});await say(`${p.n}ターンの間 全員が守りの力に つつまれた！`);return true;
  case 'mark':{E=E&&E.hp>0&&!E.gone?E:aliveF()[0];E.mark={n:p.n,v:p.v};await fxPlay('star','foe',{wait:200});await say(`${E.name}に 印をつけた！ 受けるダメージが ふえる！`);return true;}
  case 'growth':{me.bs.atkUp=Math.min(1,(me.bs.atkUp||0)+p.v);await fxPlay('buff',me);await say(`${me.name}の 力が どんどん高まる！（+${Math.round(me.bs.atkUp*100)}%）`);return true;}
  case 'shield1':{const t=alive().reduce((a,b)=>ratio(a)<=ratio(b)?a:b),v=Math.round((S('def')+S('int')/2+me.lv)*p.k*.6+10);as(t,()=>{t.bs.barrier=(t.bs.barrier||0)+v;});await fxPlay('sanct',t,{wait:200});await say(`${t.name}を ${v}の バリアが 守る！`);return true;}
 }
 return false;}

const AU={ctx:null,bgm:null,se:null,noise:null,cur:null,fear:0,timer:null,step:0,next:0,song:null};
function audio(){
 if(!AU.ctx){try{const A=window.AudioContext||window.webkitAudioContext;AU.ctx=new A();
  AU.bgm=AU.ctx.createGain();AU.bgm.gain.value=.55;AU.bgm.connect(AU.ctx.destination);
  AU.se=AU.ctx.createGain();AU.se.gain.value=.9;AU.se.connect(AU.ctx.destination);
  const b=AU.ctx.createBuffer(1,AU.ctx.sampleRate*.5,AU.ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AU.noise=b;}catch(e){AU.ctx=null;}}
 try{if(AU.ctx&&AU.ctx.state==='suspended')AU.ctx.resume();}catch(e){}
 return AU.ctx;
}
const NOTE={C:0,'C#':1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
const nf=n=>{const m=n.match(/^([A-G][#b]?)(-?\d)$/);return m?440*Math.pow(2,(NOTE[m[1]]+(+m[2]+1)*12-69)/12):0;};
function tone(f,t0,dur,type,vol,dest,at){const a=AU.ctx;if(!a||!f)return;try{const o=a.createOscillator(),g=a.createGain(),t=(at||a.currentTime)+t0;o.type=type||'square';o.frequency.setValueAtTime(f,t);
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.06,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+Math.max(.03,dur));o.connect(g).connect(dest||AU.se);o.start(t);o.stop(t+dur+.05);}catch(e){}}
function sweep(f1,f2,t0,dur,type,vol,dest){const a=AU.ctx;if(!a)return;try{const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;o.type=type||'sawtooth';o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);
 g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(dest||AU.se);o.start(t);o.stop(t+dur+.05);}catch(e){}}
function noise(t0,dur,vol,hp,dest,at){const a=AU.ctx;if(!a)return;try{const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain(),t=(at||a.currentTime)+t0;s.buffer=AU.noise;f.type='highpass';f.frequency.value=hp||1000;
 g.gain.setValueAtTime(vol||.1,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f).connect(g).connect(dest||AU.se);s.start(t);s.stop(t+dur+.02);}catch(e){}}
function kick(at,dest){const a=AU.ctx;try{const o=a.createOscillator(),g=a.createGain();o.frequency.setValueAtTime(130,at);o.frequency.exponentialRampToValueAtTime(40,at+.12);g.gain.setValueAtTime(.35,at);g.gain.exponentialRampToValueAtTime(.001,at+.18);o.connect(g).connect(dest);o.start(at);o.stop(at+.2);}catch(e){}}

const parsed={};
function parseSong(key){
 if(parsed[key])return parsed[key];
 const S=SONGS[key],P=t=>{const tok=t.replace(/\|/g,' ').trim().split(/\s+/),out=tok.map(()=>null);
  tok.forEach((x,i)=>{if(x==='.'||x==='-')return;let len=1;while(tok[i+len]==='-')len++;out[i]={f:nf(x),len};});return out;};
 const ch=S.ch.map(c=>({...c,a:P(c.n)})),fear=(S.fear||[]).map(c=>({...c,a:P(c.n)}));
 const dr=(S.dr||'').replace(/\|/g,' ').trim().split(/\s+/);
 return parsed[key]={...S,ch,fear,dr,len:ch[0].a.length};
}
function playBGM(key,fear){
 if(AU.cur===key&&(fear||0)===AU.fear)return;
 stopBGM();AU.cur=key;AU.fear=fear||0;
 if((GS&&!GS.bgm)||!audio())return;
 const S=parseSong(key);AU.song=S;AU.step=0;AU.next=AU.ctx.currentTime+.08;
 const bpm=S.bpm+(key==='boss'?AU.fear*5:0),sd=60/bpm/2;
 AU.timer=setInterval(()=>{const a=AU.ctx;if(!a)return;
  while(AU.next<a.currentTime+.18){const i=AU.step,t=AU.next;
   const layers=[...S.ch,...S.fear.filter(c=>AU.fear>=c.lv)];
   layers.forEach(c=>{const n=c.a[i%c.a.length];if(n)tone(n.f,0,n.len*sd*.92,c.w,c.v,AU.bgm,t);});
   const d=S.dr[i%S.dr.length];
   if(d==='k')kick(t,AU.bgm);if(d==='s')noise(0,.12,.09,1500,AU.bgm,t);if(d==='h')noise(0,.04,.04,6000,AU.bgm,t);
   if(key==='boss'&&AU.fear>=4&&i%2===1)noise(0,.03,.03,7000,AU.bgm,t);
   AU.next+=sd;AU.step++;
   if(S.once&&AU.step>=S.len){clearInterval(AU.timer);AU.timer=null;break;}
   AU.step%=S.once?1e9:S.len;}
 },25);
}

 while(run.length<6){const s=pick(pool);if(!run.some(r=>r.name===s.name))run.push({sid:s.id,name:s.name});}
 const d=pick(RDIST);
 run.forEach((r,i)=>{const s=SPECIES[r.sid],p=FAMS[s.fam].pf;
  r.no=i+1;r.spd=Math.round(Math.max(35,Math.min(99,42+s.rank*6+(p.agi-1)*30+rnd(-14,14))));
  r.sta=Math.round(Math.max(35,Math.min(99,42+s.rank*6+(p.hp-1)*30+rnd(-14,14))));

 const base=r=>r.spd*d[2]+r.sta*(1-d[2]);
 // 「調子はいいのに能力が足りない」穴馬と、「強いのに不調」を必ず混ぜる
 const byB=[...run].sort((a,b)=>base(a)-base(b));byB[0].cond=pick([3,4]);if(Math.random()<.6)byB[5].cond=pick([0,1]);
 run.forEach(r=>r.str=base(r)+(r.cond-2)*6);
 const wins=Array(6).fill(0),N=4000;
 for(let k=0;k<N;k++){let bi=0,bv=-1e9;run.forEach((r,i)=>{const v=r.str+gauss()*R_SD;if(v>bv){bv=v;bi=i;}});wins[bi]++;}
 run.forEach((r,i)=>{r.p=Math.max(wins[i],2)/N;});
 const s=run.reduce((a,r)=>a+r.p,0);run.forEach(r=>{r.p/=s;r.odds=Math.min(999.9,Math.max(1.1,Math.round(TAKE/r.p*10)/10));});

function slDraw(){for(let r=0;r<3;r++){const e=$('#strip'+r);if(!e)return;const p=SLS.pos[r];

function slLever(){
 const sd=slotDay(),m=sd.m[SLM];if(SLS.spin)return;
 const cost=m.bonus?1:m.replay?0:3;
 if(GS.coin<cost){slMsg('コインが足りません');return;}
 GS.coin-=cost;m.replay=false;
 let allow;
 if(m.bonus)allow=SL_BONUS[m.bonus.kind].role;
 else{m.tot++;m.g++;const f=slotLottery(m);
  if(m.flag)allow=m.flag;
  else if(f==='BIG'||f==='REG'){m.flag=f;m.lit=false;m.litT=Math.random()<.3?'lever':'stop';allow=f;}
  else allow=f;
  if(m.flag&&!m.lit&&m.litT==='lever'){m.lit=true;setTimeout(()=>slLamp(m),120);}}
 SLS.allow=allow;SLS.stops=[null,null,null];SLS.spin=true;SLS.t0=performance.now();SLS.last=SLS.t0;SLS.target=[null,null,null];SLS.wins=null;document.querySelectorAll('.slines polyline,.lno').forEach(e=>e.classList.remove('hit'));
 tabbar(false);SE('lever');$('#lever').disabled=true;$('#slcoin').textContent=coinF(GS.coin);$('#slpay').textContent='0';
 if(!m.bonus)slMsg(m.flag&&m.lit?'<b>ボーナス確定！</b><br>7を狙え！':cost?'回転中…':'<b>REPLAY</b>');
 setTimeout(()=>document.querySelectorAll('.stopb').forEach(b=>b.disabled=false),350);
 const loop=now=>{const dt=Math.min(.05,(now-SLS.last)/1000);SLS.last=now;let moving=0;
  for(let r=0;r<3;r++){const T=SLS.target[r];
   if(T==null){SLS.pos[r]-=SL_SPEED*dt;moving++;}
   else if(SLS.pos[r]>T){SLS.pos[r]=Math.max(T,SLS.pos[r]-SL_SPEED*dt);moving++;}}
  slDraw();
  if(moving||SLS.stops.some(v=>v==null))requestAnimationFrame(loop);else slEnd();};
 requestAnimationFrame(loop);
}
function slStop(r){
 const sd=slotDay(),m=sd.m[SLM];
 if(!SLS.spin||SLS.stops[r]!=null||performance.now()-SLS.t0<300)return;
 const k=slChoose(r,SLS.pos[r],SLS.stops,SLS.allow,(sd.assist&&!!m.lit&&!m.bonus)||!!m.bonus);
 SLS.stops[r]=k;SLS.target[r]=k;SE('stop');
 const b=document.querySelector(`.stopb[data-r="${r}"]`);if(b)b.disabled=true;
}
function slEnd(){
 const sd=slotDay(),m=sd.m[SLM];
 SLS.pos=SLS.pos.map(p=>md(Math.round(p)));m.pos=[...SLS.pos];
 const W=slWins(SLS.stops),has=k=>W.some(([c])=>c===k);let pay=0,msg='';
 const big=has('BIG')?'BIG':has('REG')?'REG':null;
 if(m.bonus){
  const B=SL_BONUS[m.bonus.kind];W.forEach(([c])=>{if(c===B.role)pay+=B.pay;});
  m.bonus.paid+=pay;m.bonus.g=(m.bonus.g||0)+1;
  if(m.bonus.paid>B.end){bump('gwin',Math.max(0,m.bonus.paid-m.bonus.g));msg=`<b>${m.bonus.kind} 終了</b><br>${m.bonus.paid}枚 獲得！`;m.bonus=null;SE('win');playBGM('main');}
  else msg=`<b>${m.bonus.kind==='BIG'?'BIG BONUS':'REG BONUS'}</b><br>${m.bonus.paid}／${B.end}枚<br><small>1枚がけ</small>`;
 }else if(big){
  m.hist.push([big,m.g]);if(m.hist.length>30)m.hist.shift();m[big==='BIG'?'big':'reg']++;m.g=0;m.flag=null;m.lit=false;
  m.bonus={kind:big,paid:0,g:0};bump('sbon');
  GS.sstat=GS.sstat||{big:0,reg:0};GS.sstat[big==='BIG'?'big':'reg']++;
  SE('jackpot');playBGM('title');msg=`<b>${big==='BIG'?'BIG BONUS!!':'REG BONUS!'}</b><br>スタート！`;
 }else{
  const nm=[];W.forEach(([c])=>{if(SL_PAY[c]){pay+=SL_PAY[c];}});
  if(has('G')){m.gem++;nm.push('宝石');}if(has('L')){m.bell++;nm.push('ベル');}if(has('K')){m.crown++;nm.push('王冠');}if(has('A')){m.apl++;nm.push('リンゴ');}
  if(has('R')){m.replay=true;msg='<b>REPLAY</b>';}
  if(pay)msg=`${nm.join('・')} ${pay}枚`;
  if(m.flag&&!m.lit&&m.litT==='stop'){m.lit=true;slLamp(m);msg='<b>ボーナス確定！</b><br>7を狙え！';}
  else if(m.flag&&m.lit&&!msg)msg='<b>ボーナス確定！</b><br>7を狙え！';
 }
 GS.coin+=pay;if(pay)SE(m.bonus?'chime':'flip');
 SLS.spin=false;SLS.wins=W;saveGame();
 const keep=msg;tabSlot();if(keep)slMsg(keep);$('#slpay').textContent=pay;tabbar(true);
 W.forEach(([c,li])=>{const e=$('#ln'+li);if(e)e.classList.add('hit');const n=document.querySelector('.lno.l'+li);if(n)n.classList.add('hit');});
}

/* ===== フレンド：申請→承認でフレンド。プロフィール・オンライン表示・招待（共有データ経由） ===== */
const FR={inbox:null,prof:{},last:0,timer:null,inv:null};
const frDoc=(kind,code)=>store.db?store.db.doc(`${kind}/${code}`):null;
const docData=r=>r?(typeof r.data==='function'?r.data():(r.data!==undefined?r.data:r)):null;
async function frGet(kind,code){try{const ref=frDoc(kind,code);if(!ref)return null;return docData(await ref.get());}catch(e){return null;}}
async function frPush(code,key,item){ // 相手の受信箱に追加（同じ相手からの同じ種類は1件にまとめる）
 const ref=frDoc('inbox',code);if(!ref)return false;
 try{const cur=docData(await ref.get())||{};const list=(cur[key]||[]).filter(x=>x.from!==item.from).slice(-20);list.push(item);await ref.set({...cur,[key]:list});return true;}catch(e){return false;}
}
async function frTake(key,from){ // 自分の受信箱から取り除く
 const ref=frDoc('inbox',GS.friendCode);if(!ref)return;
 try{const cur=docData(await ref.get())||{};cur[key]=(cur[key]||[]).filter(x=>x.from!==from);await ref.set(cur);FR.inbox=cur;}catch(e){}
}
async function frBeat(){ // 自分のプロフィールを更新（オンライン表示用）
 const ref=frDoc('prof',GS.friendCode);if(!ref)return;const h=GS.roster[0];
 try{await ref.set({n:h.name.slice(0,10),lv:h.lv,job:JOBS[h.jobKey].name,lay:GS.lay.max,lk:lookOf(h),seen:Date.now()});}catch(e){}
}
async function frPoll(force){
 if(!GS||!store.db)return;if(!force&&Date.now()-FR.last<12000)return;FR.last=Date.now();
 frBeat();
 const box=await frGet('inbox',GS.friendCode)||{};FR.inbox=box;let ch=false;
 // 承認が届いていたらフレンド確定
 for(const a of box.acc||[]){const f=GS.friends.find(x=>x.code===a.from);if(f&&f.st!=='ok'){f.st='ok';f.n=a.n;ch=true;}else if(!f){GS.friends.push({code:a.from,n:a.n,st:'ok'});ch=true;}await frTake('acc',a.from);}
 if(ch)saveGame();
 // フレンドのプロフィール
 await Promise.all(GS.friends.map(async f=>{const p=await frGet('prof',f.code);if(p)FR.prof[f.code]=p;}));
 // 招待（3分以内・フレンドからのみ）
 const inv=(box.inv||[]).filter(x=>Date.now()-x.at<180000&&GS.friends.some(f=>f.code===x.from&&f.st==='ok'));
 if(inv.length&&!NET.R&&!D&&!$('#invpop'))showInvite(inv[inv.length-1]);
 updateBadges();
 if(TAB==='friend'&&NET.screen!=='match'&&$('#frlist'))tabFriend('',true);
}
function frStart(){if(FR.timer)return;FR.timer=setInterval(()=>frPoll(),15000);setTimeout(()=>frPoll(true),1500);}
const frReqs=()=>((FR.inbox&&FR.inbox.req)||[]).filter(r=>!GS.friends.some(f=>f.code===r.from&&f.st==='ok'));
const frOnline=c=>{const p=FR.prof[c];return p&&Date.now()-p.seen<150000;};
function showInvite(v){
 const el=document.createElement('div');el.id='invpop';
 el.innerHTML=`<div class="tbox"><p class="tt">フレンドから招待</p><h2>${esc(v.n)}さんから<br>${v.mode==='battle'?'対戦':'協力ダンジョン'}の招待！</h2>
  <p class="sub">ルームコード ${esc(String(v.room).toUpperCase())}</p><button class="cta" id="iv-ok">参加する</button><button id="iv-no">あとで</button></div>`;
 document.body.appendChild(el);SE('chime');

 $('#iv-ok').onclick=async()=>{el.remove();await frTake('inv',v.from);renderMain('multi');await netJoin(String(v.room).toLowerCase(),false,v.mode);};

 <div class="win" id="frlist"><h2>フレンド（${ok.length}）</h2>${ok.length?ok.map(row).join(''):'<p class="sub">まだフレンドがいません。</p>'}

 $('#addf').onsubmit=async e=>{e.preventDefault();const v=$('#fc').value.trim().toUpperCase().replace(/^([A-Z0-9]{4})([A-Z0-9]{4})$/,'$1-$2');

  const p=await frGet('prof',v);if(!p){$('#ferr').textContent='そのコードのプレイヤーが見つかりません（相手が一度このゲームを開いている必要があります）。';return;}
  // 相手からも申請が来ていれば、その場でフレンド成立
  const mutual=frReqs().some(r=>r.from===v);
  const okSend=await frPush(v,mutual?'acc':'req',{from:GS.friendCode,n:GS.roster[0].name.slice(0,10),at:Date.now()});
  if(!okSend){$('#ferr').textContent='送信できませんでした。少し待ってからもう一度ためしてください。';return;}
  GS.friends.push({code:v,n:p.n,st:mutual?'ok':'pending'});if(mutual)await frTake('req',v);saveGame();
  tabFriend(`<p class="note">${esc(p.n)}さんに ${mutual?'承認を送り、フレンドになった！':'フレンド申請を送った。相手が承認するとフレンドになります。'}</p>`);};
 document.querySelectorAll('[data-acc]').forEach(b=>b.onclick=async()=>{const c=b.dataset.acc,nm=b.dataset.n;b.disabled=true;
  await frPush(c,'acc',{from:GS.friendCode,n:GS.roster[0].name.slice(0,10),at:Date.now()});await frTake('req',c);

function masteredJobs(h){return Object.entries(h.trees||{}).filter(([k,t])=>isMastered(t)).map(([k])=>k);}
function specialAvail(h){
 const ms=masteredJobs(h),out=new Set();
 ms.forEach(k=>{const a=JOBS[k].arch;if(a&&SPECIAL_BY[a])out.add(SPECIAL_BY[a]);});
 if(ms.length>=3)out.add('overlord');
 return [...out];
}
function switchJob(h,key){
 const old=JOBS[h.jobKey],nw=JOBS[key];nw.G=nw.G||buildTree(nw);
 h.trees=h.trees||{};h.trees[h.jobKey]=h.tree;
 STATS.forEach(([k])=>h.st[k]=Math.max(1,h.st[k]-old.base[k]+nw.base[k]));
 h.jobKey=key;h.job=nw;h.G=nw.G;h.tree=h.trees[key]=h.trees[key]||[];
 if(!h.jobsOwned.includes(key))h.jobsOwned.push(key);
 fixHp(h);
}

 if(D.floor===D.total&&D.boss){GLAY.bossL=true;const e=adaptFoe(foeFrom(I.boss,lvl+2,'boss'));GLAY.bossL=false;if(I.L>=10){e.hp=e.max=Math.round(e.hp*1.12);e.atk=Math.round(e.atk*1.06);e.int=Math.round(e.int*1.06);}return e;}

const GLAY={start:null,spec:{}};
const gOn=()=>!!(window.__FB_ADAPTER&&store.db);
const gGet=async p=>{try{const r=await store.db.doc(p).get();return r&&r.exists?r.data():null;}catch(e){return null;}};
const gMake=async(p,v)=>{try{await store.db.doc(p).set(v);return true;}catch(e){return false;}};
async function gStart(){
 if(GLAY.start!=null)return GLAY.start;
 let v=await gGet('meta/gstart');
 if(!v){try{await frontierSync();}catch(e){}const st=Math.max(FRONT||0,GS.lay.max)+1;await gMake('meta/gstart',{L:st,at:Date.now()});v=await gGet('meta/gstart')||{L:st};}

}
async function gSpec(L,depth){
 if(!gOn())return null;if(GLAY.spec[L])return GLAY.spec[L];
 const st=await gStart();if(L<st)return null;
 let v=await gGet('layers/'+L);
 if(!v){
  await recPush();
  const top=await strongest();
  const me={...recBody(),n:GS.roster[0].name};
  const c=[top?{...top,alv:top.lvx,pk:top.pkx,pw:top.pwx}:null,me].filter(x=>x&&x.pw).sort((a,b)=>b.pw-a.pw)[0]||me;
  const prev=L>st&&(depth||0)<3?await gSpec(L-1,(depth||0)+1):null;
  const gr=Math.max(.5,Math.min(3,+c.gr||1.6)),ahead=Math.max(0,L-(+c.lay||L));
  let lv=Math.max((+c.alv||avgLv())+gr*ahead,expLv(L)),pk=Math.max(1,+c.pk||1);
  if(prev){lv=Math.max(lv,prev.lv+1.2);pk=Math.max(pk,prev.pk);}
  const spec={L,lv:+lv.toFixed(1),pk:+Math.min(3.5,pk).toFixed(2),ad:+Math.min(.6,.35+.012*(L-st)).toFixed(3),by:String(c.n||'').slice(0,10),at:Date.now()};
  await gMake('layers/'+L,spec);v=await gGet('layers/'+L)||spec;
 }
 return GLAY.spec[L]=v;
}
const gSpecT=L=>Promise.race([gSpec(L).catch(()=>null),new Promise(r=>setTimeout(()=>r(null),6000))]);

 const sec=SY_SECRET.find(x=>(x.a===ca&&x.b===cb)||(x.a===cb&&x.b===ca));
 if(sec)return {kind:'secret',sec,r:Math.min(7,Math.max(5,r)+1),ca,cb};
 const sa=!!a.skill,sb=!!b.skill;
 let kind=sa&&sb?(ca===cb?'up':'combo'):sa||sb?'side':(ca===cb?'effup':'effmix');
 return {kind,r:Math.min(6,r),upChance:same&&r<6?.35:0,ca,cb};
}
const SYKIND={up:'同じ系統の技 → 強化版の技',combo:'ちがう系統の技 → 2つの力を合わせた複合技',side:'技＋能力 → 能力の効果がついた技',effup:'同じ系統の能力 → 強化された能力',effmix:'ちがう能力 → 2つの効果を持つ能力',secret:'？？？ ひみつの組み合わせ'};
function doSynth(a,b){
 const pl=synthPlan(a,b);let r=pl.r;if(pl.upChance&&Math.random()<pl.upChance)r++;
 const t=SY_T[r]+1,base=a.skill?a:b,other=base===a?b:a;let raw,name;
 const strip=n=>String(n).replace(/[・改極]+$/,'').replace(/・.+$/,'');
 if(pl.kind==='secret'){raw=pl.sec.make(t);name=pl.sec.name;GS.syDex=GS.syDex||{};GS.syDex[pl.sec.name]=1;}
 else if(pl.kind==='up'){raw=genLike(pl.ca,t,a);name=strip(a.name)+'・改';}
 else if(pl.kind==='combo'){const x=STATOF[pl.ca]||'str',y=STATOF[pl.cb]||'int',sd=SY_SIDE[pl.cb]||SY_SIDE.atk;
  raw={skill:{type:'hybrid',stats:[x,y],pow:+(1.3+.22*t).toFixed(1),mp:6+t,[sd[0]]:sd[1],sideTxt:sd[2]}};
  if(x===y)raw.skill.pow=+(raw.skill.pow*1.2).toFixed(1);name=strip(a.name).slice(0,2)+strip(b.name).slice(-2)+'の合成技';}
 else if(pl.kind==='side'){const oc=syCat(other),sd=SY_SIDE[oc]||SY_SIDE.atk;raw=genLike(syCat(base),t,base);const sk={...raw.skill};
  let suf=({heal:'吸',mag:'氷',crit:'極',item:'盗',guard:'守',lowhp:'捨',scout:'盗',buff:'極',atk:'連',phys:'連'}[oc]||'改');
  if(sk.type==='heal'){sk.pow=+(sk.pow*1.35).toFixed(1);suf='改';}
  else if(sk.type==='sanct'){sk.turns=(sk.turns||3)+1;suf='改';}
  else if(sk.type==='buff'){sk.bheal=true;sk.mp=Math.max(1,sk.mp-1);sk.desc='力をためて次の攻撃を強くし、回復する';suf='改';}
  else if(sd[0]==='hits'){if(sk.type==='mag')sk.pow=+(sk.pow*1.25).toFixed(1);else{sk.hits=(sk.hits||1)+1;if(sk.type==='phys'){sk.type='multi';sk.pow=+(sk.pow*.6).toFixed(2);}}}
  else if(sd[0]==='self'){sk.self=.06;if(sk.pow)sk.pow=+(sk.pow*1.3).toFixed(1);}
  else if(sk.type==='mag'&&sd[0]!=='freeze'){sk.pow=+(sk.pow*1.15).toFixed(1);sk.freeze=Math.max(sk.freeze||0,.2);}
  else if(sk.type==='hybrid'){sk[sd[0]]=sd[1];sk.sideTxt=(sk.sideTxt||'')+sd[2];}
  else sk[sd[0]]=sd[1];
  raw={skill:sk};name=strip(base.name)+'・'+suf;}
 else{const ea=(a.eff||{}),eb=(b.eff||{}),e={},k=pl.kind==='effup'?1.25:.85;
  [ea,eb].forEach(x=>Object.entries(x).forEach(([kk,v])=>{if(typeof v==='number')e[kk]=(e[kk]||0)+v*k;else e[kk]=v;}));
  Object.keys(e).forEach(kk=>{if(typeof e[kk]==='number')e[kk]=kk.startsWith('s_')||kk==='hpFlat'||kk==='mpFlat'||kk==='endure'||kk==='mpCut'?Math.round(e[kk]):+e[kk].toFixed(2);});
  raw={eff:e};name=pl.kind==='effup'?strip(a.name)+'・改':strip(a.name).slice(0,2)+strip(b.name).slice(-2);}
 const u=makeUniq(pl.ca,1,raw);u.name=name;if(u.skill){u.skill.name=name;u.skill.uq=false;u.skill.gs=true;u.skill.desc=skillDesc(u.skill);u.desc=`とくぎ MP${u.skill.mp}：${u.skill.desc}`;}
 u.rar=r;u.gacha=true;u.synth=true;if(pl.kind==='secret')u.secret=true;
 GS.sbag=GS.sbag.filter(x=>x!==a&&x!==b);GS.sbag.push(u);bump('synth');return {u,pl};
}
function renderSynth(ia,ib,msg){
 tabbar(false);wide(false);
 const bag=GS.sbag,A=bag[ia],Bs=bag[ib];
 const card=u=>`<span class="sycard r${u.rar}"><span class="star">${'★'.repeat(u.rar)}</span><b>${esc(u.name)}</b><small>${u.desc}</small></span>`;
 let prev='<p class="sub">合成するスキルを2つえらんでください。組み合わせによって 強化・複合技・効果つきの技などに生まれ変わります。<b>ひみつの組み合わせ</b>では 特別なスキルが生まれることも…。元の2つは なくなります。</p>';
 if(A&&Bs){const pl=synthPlan(A,Bs);
  prev=`<p class="note ${pl.kind==='secret'?'story':''}">${SYKIND[pl.kind]}</p><p class="sub">できあがり：${'★'.repeat(pl.r)}${pl.kind==='secret'&&pl.r>=7?'（★7 合成限定！）':''}${pl.upChance?`　${Math.round(pl.upChance*100)}%で ★+1`:''}　強さは元より1段階アップ</p>`;}
 const found=Object.keys(GS.syDex||{}).length;
 $('#app').innerHTML=`<div class="win"><h2>スキル合成</h2>${msg?`<p class="note">${msg}</p>`:''}
  <div class="bpair sy"><div class="bslot">${A?card(A):'<span>スキル1</span>'}</div><span class="plus">＋</span><div class="bslot">${Bs?card(Bs):'<span>スキル2</span>'}</div></div>
  ${prev}<button class="cta" id="go" ${A&&Bs?'':'disabled'}>合成する</button>
  <p class="sub" style="margin-top:6px">ひみつの組み合わせ 発見：${found} / ${SY_SECRET.length}　${found?`（${Object.keys(GS.syDex).map(esc).join('・')}）`:''}</p></div>
 <div class="win"><h2>手持ちのスキル（${bag.length}）</h2><p class="sub">だれにも つけていないスキルだけ 合成できます。</p>
  ${bag.length?`<div class="sylist">${bag.map((u,i)=>`<button class="syb ${i===ia||i===ib?'inp':''}" data-i="${i}">${card(u)}<em>${u.skill?'技':'能力'}</em></button>`).join('')}</div>`:'<p class="sub">スキルがありません。スキルガチャで手に入ります。</p>'}</div>
 <button class="cta" id="bk">もどる</button>`;
 document.querySelectorAll('.syb').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;
  if(i===ia)renderSynth(ib,null);else if(i===ib)renderSynth(ia,null);else if(ia==null)renderSynth(i,ib);else if(ib==null)renderSynth(ia,i);else renderSynth(ia,i);});
 $('#go').onclick=async()=>{const {u,pl}=doSynth(A,Bs);saveGame();await synthShow(u,pl);};
 $('#bk').onclick=()=>renderMain('party');
}

 const notes=[],WB=party().reduce((a,m)=>{const d=as(m,mods);a.g+=d.winGold||0;a.x+=d.winExp||0;return a;},{g:0,x:0}),TX=Math.round(ES.reduce((a,e)=>a+e.exp,0)*(B.expx||1)*(1+WB.x)),TG=Math.round(ES.reduce((a,e)=>a+e.gold,0)*(1+WB.g));
 GS.gold+=TG;if(D)D.earned+=TG;notes.push(`${TX} の けいけんちと ${TG}G を かくとく`);
 for(const m of party()){P=m;const md=mods();
  ES.forEach(e=>hab('slay_'+e.fam));if(B.turn===1)hab('quick');if(m.hp>0&&!m.bs.took)hab('nodmg');if(m.hp>0&&m.bs.minR<=.15)hab('comeback');
  if(m.hp>0&&md.postHeal&&m.hp<maxHP()){m.hp=Math.min(maxHP(),m.hp+Math.round(maxHP()*md.postHeal));}
  m.exp+=TX;let up=0;while(m.exp>=expNeed(m.lv)){m.exp-=expNeed(m.lv);m.lv++;up++;}
  if(up){m.pend+=up;const lb=lvBonus(m)*up;if(lb)m.pts+=lb;SE('levelup');notes.push(`${m.name}は レベル${m.lv}に あがった！${lb?`（素質ボーナス ステ+${lb}）`:''}`);}
  if(Math.random()<(md.dropPct||0)/2){const k=pick(Object.keys(ITEMS));GS.items[k]=(GS.items[k]||0)+1;notes.push(`${m.name}が ${ITEMS[k].name}を 見つけた`);}
  awaken().forEach(u=>notes.push(u.evo?`<span class="uqt">★ ${m.name}の固有スキルが「${u.name}」に進化した！（${u.desc}）</span>`:`<span class="uqt">★ ${m.name}は 「${u.cat}」のクセから 固有スキル「${u.name}」に目覚めた！（${u.desc}）</span>`));
 }
 if(Math.random()<.45){const k=pick(Object.keys(ITEMS));GS.items[k]=(GS.items[k]||0)+1;notes.push(`${ITEMS[k].name}を 手に入れた`);}
 for(const E of ES)if(E.scouted){bump('scout');const nm=newMonster(E.sid,E.shiny,0);GS.roster.push(nm);if(GS.party.length<4)GS.party.push(nm.id);
  notes.unshift(`<span class="uqt">★ ${nm.name}（${FAMS[E.fam].name}・ランク${E.rank}）が 仲間になった！ ${GS.party.includes(nm.id)?'パーティに加わった。':'ひかえに入った。'}</span>`);}
 for(const E of ES)if(D&&!D.special&&D.I&&E.kind!=='boss'&&(E.shiny?Math.random()<.35:(E.rank>D.I.r[1]&&Math.random()<.05))){
  GS.phantom={sid:'ph_'+E.sid,until:Date.now()+86400000};notes.push(`<span class="uqt">★ どこかで 幻の気配がする…（スペシャルダンジョンに「幻の泉」が出現！ 24時間以内に挑戦しよう）</span>`);}
 const c=$('#cmd');c.className='cmd list';$('#who').textContent='';$('#cmd2').innerHTML='';
 c.innerHTML=`<button class="cta" id="nx" style="grid-column:1/-1;margin:0">つぎへ</button>`;
 $('#nx').onclick=()=>lvChoices(()=>C.onWin(notes));
}
function lvChoices(next){const m=GS.roster.find(x=>x.pend>0);if(!m)return next();P=m;renderLvChoice(()=>lvChoices(next));}
async function lose(){
 await say('パーティは ぜんめつした…');
 AUTO=false;const c=$('#cmd');c.className='cmd list';$('#who').textContent='';$('#cmd2').innerHTML='';
 c.innerHTML=`<button class="cta" id="re" style="grid-column:1/-1;margin:0">町へ もどる</button>`;
 $('#re').onclick=()=>C.onLose();
}

setupTabs();
renderTitle();
}
</script>
